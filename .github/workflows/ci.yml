name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: vet + build + test + regenerate
    # GitHub-hosted: goasm has no private dependencies and needs no fork
    # toolchain, and this repository has no self-hosted runner registered.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go version
        run: go version

      - name: gofmt
        run: |
          out=$(gofmt -l . 2>/dev/null || true)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      # The library and the command are what this repository owns. jit/ is
      # a sample of generated output whose Emitter is arm64-only (#1, step
      # 3: reference or fixture is still to be decided), so it is checked
      # by gen's golden test as bytes, not compiled here.
      - name: go vet
        run: go vet ./template/... ./gen/... ./cmd/...

      - name: build
        run: go build ./template/... ./gen/... ./cmd/...

      - name: test (includes the golden check over jit/)
        run: go test -race ./template/... ./gen/... ./cmd/...

      - name: regeneration leaves the tree unchanged
        run: |
          go generate ./...
          if ! git diff --exit-code --stat; then
            echo "::error::go generate ./... changed committed files; regenerate and commit jit/"
            exit 1
          fi
