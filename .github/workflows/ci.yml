name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: vet + build + test + regenerate
    # GitHub-hosted: goasm has no private dependencies and needs no fork
    # toolchain, and this repository has no self-hosted runner registered.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go version
        run: go version

      - name: gofmt
        run: |
          out=$(gofmt -l . 2>/dev/null || true)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      # The generated emitters and their templates are fixtures under
      # gen/testdata: the golden test checks them as bytes, and the arm64
      # output is type-checked against a reference Emitter on any host.
      - name: go vet
        run: go vet ./...

      - name: build (host, and cross-built for the other architecture)
        run: |
          go build ./...
          GOARCH=arm64 go build ./...

      - name: test (includes the golden check over gen/testdata)
        run: go test -race ./...

      - name: regeneration leaves the tree unchanged
        run: |
          go generate ./...
          if ! git diff --exit-code --stat; then
            echo "::error::go generate ./... changed committed files; regenerate and commit gen/testdata/jit/"
            exit 1
          fi
